# Used only inside the Docker frontend image (see frontend/Dockerfile).
# This is different from nginx/dream-vacation-planner.conf, which is for
# the plain (non-Docker) EC2 deployment described in the main README.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" is the service name from docker-compose.yml — Docker's
    # internal DNS resolves it to the backend container automatically.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
