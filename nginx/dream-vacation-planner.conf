# Nginx site config for Dream Vacation Planner
#
# Install on the EC2 instance at:
#   /etc/nginx/sites-available/dream-vacation-planner.conf
# then enable it with:
#   sudo ln -s /etc/nginx/sites-available/dream-vacation-planner.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# The Application Load Balancer terminates HTTPS and forwards plain HTTP
# to this server on port 80, so Nginx itself does not need a certificate.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Serve the built React app
    root /var/www/dream-vacation-planner/frontend/dist;
    index index.html;

    # React Router / client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: forward API calls to the Node/Express backend
    # running on the same instance via PM2 or systemd on port 5000.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Basic caching for static assets built by Vite
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Trust the ALB's X-Forwarded-Proto header so the app knows
    # the original request came in over HTTPS.
    real_ip_header X-Forwarded-For;
}
