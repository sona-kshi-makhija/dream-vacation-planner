<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#45607A"/>
    </marker>
  </defs>

  <rect width="1200" height="380" fill="#FBF7EF"/>
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F2A3D">
    Dream Vacation Planner — AWS Architecture
  </text>

  <!-- Nodes -->
  <g font-size="13" fill="#0F2A3D">
    <!-- User -->
    <rect x="20" y="150" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#D9CEB8" stroke-width="1.5"/>
    <text x="80" y="180" text-anchor="middle" font-weight="700">User</text>
    <text x="80" y="198" text-anchor="middle" fill="#45607A" font-size="11">Browser</text>

    <!-- Domain / Route53 -->
    <rect x="180" y="150" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#D9CEB8" stroke-width="1.5"/>
    <text x="245" y="176" text-anchor="middle" font-weight="700">Custom Domain</text>
    <text x="245" y="194" text-anchor="middle" fill="#45607A" font-size="11">Route 53 / DNS</text>
    <text x="245" y="210" text-anchor="middle" fill="#45607A" font-size="11">HTTPS</text>

    <!-- ALB -->
    <rect x="350" y="150" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#1F6F63" stroke-width="2"/>
    <text x="425" y="176" text-anchor="middle" font-weight="700">Application</text>
    <text x="425" y="192" text-anchor="middle" font-weight="700">Load Balancer</text>
    <text x="425" y="208" text-anchor="middle" fill="#1F6F63" font-size="11">ACM SSL cert (HTTPS)</text>

    <!-- EC2 box -->
    <rect x="540" y="80" width="330" height="220" rx="12" fill="#FFFFFF" stroke="#D9CEB8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="705" y="100" text-anchor="middle" font-size="12" fill="#45607A">EC2 (Ubuntu instance)</text>

    <!-- Nginx -->
    <rect x="565" y="120" width="120" height="60" rx="8" fill="#F2A65A"/>
    <text x="625" y="146" text-anchor="middle" font-weight="700" fill="#0F2A3D">Nginx</text>
    <text x="625" y="163" text-anchor="middle" font-size="11" fill="#0F2A3D">reverse proxy</text>

    <!-- Frontend -->
    <rect x="565" y="200" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#1F6F63" stroke-width="1.5"/>
    <text x="625" y="226" text-anchor="middle" font-weight="700">React</text>
    <text x="625" y="243" text-anchor="middle" font-size="11" fill="#45607A">Frontend build</text>

    <!-- Backend -->
    <rect x="715" y="160" width="130" height="60" rx="8" fill="#1F6F63"/>
    <text x="780" y="186" text-anchor="middle" font-weight="700" fill="#FFFFFF">Backend REST API</text>
    <text x="780" y="203" text-anchor="middle" font-size="11" fill="#EAF3F1">Node.js / Express</text>

    <!-- RDS -->
    <rect x="960" y="150" width="180" height="70" rx="10" fill="#0F2A3D"/>
    <text x="1050" y="178" text-anchor="middle" font-weight="700" fill="#FFFFFF">Amazon RDS</text>
    <text x="1050" y="196" text-anchor="middle" font-size="11" fill="#D9CEB8">MySQL Database</text>
  </g>

  <!-- Arrows -->
  <g stroke="#45607A" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="185" x2="178" y2="185"/>
    <line x1="310" y1="185" x2="348" y2="185"/>
    <line x1="500" y1="185" x2="563" y2="150"/>
    <line x1="685" y1="150" x2="713" y2="180"/>
    <line x1="845" y1="185" x2="958" y2="185"/>
  </g>

  <text x="600" y="345" text-anchor="middle" font-size="12" fill="#45607A">
    User → Domain (HTTPS) → ALB (ACM cert) → Nginx → React frontend → Express REST API → Amazon RDS (MySQL)
  </text>
  <text x="600" y="365" text-anchor="middle" font-size="11" fill="#8A97A3">
    Deployment: git clone + git pull on EC2 via SSH — no CI/CD pipeline
  </text>
</svg>
